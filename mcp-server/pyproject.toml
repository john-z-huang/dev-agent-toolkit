[project]
name = "dev-agent-toolkit-tools"
version = "0.2.0"
description = "Dedicated MCP tools for Dev Agent Toolkit"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pydantic>=2,<3", "openai>=3.37,<4", "httpx2[socks]>=2.16,<3", "anyio>=4,<5", "jsonschema>=4.18,<5", "referencing>=0.28,<1"]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "pyyaml>=6,<7",
    "ruff>=0.17.4",
    "ty>=0.0.96",
]

[project.urls]
Repository = "https://github.com/john-z-huang/dev-agent-toolkit"

[project.scripts]
dev-agent-toolkit-tools = "dev_agent_toolkit_tools.server:main"
dev-agent-toolkit = "dev_agent_toolkit_tools.cli:main"
dev-agent-toolkit-mcp = "dev_agent_toolkit_tools.mcp_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dev_agent_toolkit_tools"]

[tool.hatch.build.targets.sdist]
include = ["dev_agent_toolkit_tools", "hatch_build.py", "pyproject.toml"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi", "*.pyw"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python-version = "3.11"
