[project]
name = "dev-workflow-standards-hooks"
version = "0.2.0"
description = "Offline Codex lifecycle hooks and registration for development standards"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.96",
]

[project.scripts]
dev-workflow-standards-hooks = "dev_workflow_standards_hooks.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dev_workflow_standards_hooks"]

[tool.hatch.build.targets.sdist]
include = ["dev_workflow_standards_hooks", "pyproject.toml", "README.md"]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi", "*.pyw"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python-version = "3.11"
