[project]
name = "dev-agent-toolkit-hooks"
version = "0.2.0"
description = "Offline Codex lifecycle hooks and registration for Dev Agent Toolkit"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.96",
]

[project.urls]
Repository = "https://github.com/john-z-huang/dev-agent-toolkit"

[project.scripts]
dev-agent-toolkit-hooks = "dev_agent_toolkit_hooks.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dev_agent_toolkit_hooks"]

[tool.hatch.build.targets.sdist]
include = ["dev_agent_toolkit_hooks", "pyproject.toml", "README.md"]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi", "*.pyw"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python-version = "3.11"
