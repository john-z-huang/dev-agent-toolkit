[project]
name = "dev-workflow-standards-hooks"
version = "0.2.0"
description = "Offline Codex lifecycle hooks and registration for development standards"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dev-workflow-standards-hooks = "dev_workflow_standards_hooks.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dev_workflow_standards_hooks"]

[tool.hatch.build.targets.sdist]
include = ["dev_workflow_standards_hooks", "pyproject.toml", "README.md"]
